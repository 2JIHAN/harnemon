name: "🐛 Bug Report"
description: "Create a report to help us reproduce and fix a bug in Harnemon"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in Harnemon!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'harnemon adopt nimbleet'
        2. Execute '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Fedora/Other)
        - Windows (WSL2)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Harnemon Version
      placeholder: "e.g. harnemon v0.8.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: CLI Output / Logs
      description: Paste terminal output or error messages if applicable.
      render: shell
