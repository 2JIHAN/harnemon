name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Shell Script Syntax
        run: |
          bash -n bin/harnemon
          find species templates -name "*.sh" -exec bash -n {} + 2>/dev/null || true

      - name: Test Harnemon CLI Commands
        run: |
          chmod +x bin/harnemon
          ./bin/harnemon setup
          ./bin/harnemon help
          ./bin/harnemon dex
          ./bin/harnemon version
          ./bin/harnemon update

      - name: Test Incubator Lifecycle (Egg -> Learn -> Hatch -> Rest)
        run: |
          mkdir -p /tmp/test-harness
          ./bin/harnemon incubate /tmp/test-harness
          ./bin/harnemon status /tmp/test-harness
          ./bin/harnemon audit /tmp/test-harness

          # An egg with nothing absorbed must refuse to hatch
          if ./bin/harnemon hatch "Tooearly" /tmp/test-harness; then
            echo "Expected the hatch gate to reject an empty egg"; exit 1
          fi

          ./bin/harnemon note "Always run pnpm build before deploying" --dir /tmp/test-harness
          ./bin/harnemon note "Prefer native fetch over axios" --type convention --dir /tmp/test-harness
          ./bin/harnemon note "Use tabs, not spaces" --dir /tmp/test-harness
          ./bin/harnemon note "Ship migrations in a separate PR" --type decision --dir /tmp/test-harness
          ./bin/harnemon note "Always run pnpm build before deploying" --dir /tmp/test-harness
          printf '# Build Before Deploy\n\n- Run the build before deploying.\n' \
            > /tmp/test-harness/.harnemons/egg/rules/build-before-deploy.md
          ./bin/harnemon status /tmp/test-harness

          ./bin/harnemon hatch "Testmon" --type "Test ⚡" --desc "Test Species" /tmp/test-harness
          test -f /tmp/test-harness/.harnemons/testmon/memory/MEMORY.md
          test -d /tmp/test-harness/.harnemons/testmon/memory/episodes
          ./bin/harnemon status /tmp/test-harness
          ./bin/harnemon rest /tmp/test-harness
          ./bin/harnemon rest /tmp/test-harness --apply
          ./bin/harnemon audit /tmp/test-harness

      - name: Test Starter Adoption
        run: |
          mkdir -p /tmp/test-nimbleet
          ./bin/harnemon adopt nimbleet /tmp/test-nimbleet
          ./bin/harnemon status /tmp/test-nimbleet
          ./bin/harnemon audit /tmp/test-nimbleet

      - name: Test Multi-Harnemon Party System
        run: |
          mkdir -p /tmp/test-party
          ./bin/harnemon adopt nimbleet /tmp/test-party
          ./bin/harnemon recruit monkin /tmp/test-party
          ./bin/harnemon recruit yagni /tmp/test-party
          ./bin/harnemon party /tmp/test-party
          ./bin/harnemon switch monkin /tmp/test-party
          ./bin/harnemon party /tmp/test-party
          ./bin/harnemon audit /tmp/test-party
